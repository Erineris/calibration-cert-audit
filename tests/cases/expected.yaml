    severity: 错误|无法核验
    page: 1
  - rule_id: R7
    severity: 提示
  allow:
  - R5:*
r5_no_certno_all.pdf:
  base: base_2025.pdf
  desc: 三页证书编号全删
  edits:
  - p1 'C2599000000103' → ''
  - p2 '证 书 编 号          C2599000000103' → '证 书 编 号'
  - p3 '证 书 编 号          C2599000000103' → '证 书 编 号'
  expect:
  - rule_id: R5
    severity: 错误|无法核验
