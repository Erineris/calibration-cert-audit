_说明:
  格式: 文件名 → {base, desc, edits, expect:[{rule_id, severity, page?, hint?, forbid?, disputed?}], allow:[规则:等级]}
  forbid: 命中的发现原文/理由里不该出现的字串（引用了错的数据），违反记「原文不符」
  severity: 错误|无法核验 表示两者皆可
  allow: 可接受的额外发现，不计误报；R5:* 表示任意等级的 R5
  page: 期望页码，不符记「位置不符」不记漏报
  disputed: 口径未定，单列不计入命中率
  底板: base=底板 的条目路径在 tests/base/（虚构底板，由 tests/tools/make_base.py 生成）
base_A.pdf:
  base: 底板
  desc: 底板：版式A 无结论列，无问题（考不误报）
  expect:
  - rule_id: R7
    severity: 提示
  allow: []
base_B_errors.pdf:
  base: 底板
  desc: 底板：含多处真错的示例
  expect:
  - rule_id: R2
    severity: 错误
    page: 2
    hint: '35'
  - rule_id: R1
    severity: 错误
    page: 3
    hint: '40'
  - rule_id: R1
    severity: 提示
    page: 3
    hint: '60'
  - rule_id: R1
    severity: 提示
    page: 3
    hint: '80'
  - rule_id: R7
    severity: 提示
  allow: []
base_2025.pdf:
  base: 底板
  desc: 底板：单份无规则问题
  expect:
  - rule_id: R7
    severity: 提示
  allow: []
base_2026.pdf:
  base: 底板
  desc: 底板：单份无规则问题（第3页文字流乱序）
  expect:
  - rule_id: R7
    severity: 提示
  allow: []
r1_eq_tol_pass.pdf:
  base: base_2025.pdf
  desc: 温度10℃点 修正值 +0.1→+2.0（=允差±2.0）标 Pass：等于允差不算超差
  edits:
  - p3 '+0.1' → '+2.0'
  expect:
  - rule_id: R7
    severity: 提示
  allow: []
r1_over_pass.pdf:
  base: base_2025.pdf
  desc: 温度20℃点 修正值 +0.3→+2.1（>±2.0）仍标 Pass：超差却标合格
  edits:
  - p3 '+0.3' → '+2.1'
  expect:
  - rule_id: R1
    severity: 错误
    page: 3
  - rule_id: R7
    severity: 提示
  allow: []
r1_under_fail.pdf:
  base: base_2025.pdf
  desc: 温度30℃点 +0.4 未超差，结论 Pass→Fail：未超差却标不合格
  edits:
  - p3 'Pass' → 'Fail'
  expect:
  - rule_id: R1
    severity: 错误
    page: 3
  - rule_id: R7
    severity: 提示
  allow: []
r1_over_fail.pdf:
  base: base_2025.pdf
  desc: 湿度60%RH点 +3→+6（>±5），结论 Pass→Fail：超差且已标 Fail 只提示
  edits:
  - p3 '+3' → '+6'
  - p3 'Pass' → 'Fail'
  expect:
  - rule_id: R1
    severity: 提示
    page: 3
  - rule_id: R7
    severity: 提示
  allow: []
r1_neg_over_pass.pdf:
  base: base_2025.pdf
  desc: 温度20℃点 修正值 +0.3→-2.1（|−2.1|>±2.0）仍标 Pass：负向超差
  edits:
  - p3 '+0.3' → '-2.1'
  expect:
  - rule_id: R1
    severity: 错误
    page: 3
  - rule_id: R7
    severity: 提示
  allow: []
r1_blank_conc.pdf:
  base: base_2025.pdf
  desc: 温度30℃点 结论 Pass 删空：未填结论不算错
  edits:
  - p3 'Pass' → ''
  expect:
  - rule_id: R7
    severity: 提示
  allow: []
r1_A_eq_tol.pdf:
  base: base_A.pdf
  desc: 版式A（无结论列）温度-15℃点 +0.14→+0.50（=允差±0.50）：边界不算超差
  edits:
  - p3 '+0.14' → '+0.50'
  expect:
  - rule_id: R7
    severity: 提示
  allow: []
r1_A_over_noconc.pdf:
  base: base_A.pdf
  desc: 版式A（无结论列）温度5℃点 +0.30→-0.51（>±0.50）：不构成结论冲突，只提示超差（按规则裁定：无结论列不构成冲突）
  edits:
  - p3 '+0.30' → '-0.51'
  expect:
  - rule_id: R1
    severity: 提示
    page: 3
  - rule_id: R7
    severity: 提示
  allow: []
r1_split_cell.pdf:
  base: base_2026.pdf
  desc: 2026 底板第3页被拆成「+0.」「6」的单元格改成「+2.」「6」=+2.6（>±2.0）标 Pass：考按坐标重排
  edits:
  - p3 '+0.' → '+2.'
  expect:
  - rule_id: R1
    severity: 错误
    page: 3
  - rule_id: R7
    severity: 提示
  allow: []
