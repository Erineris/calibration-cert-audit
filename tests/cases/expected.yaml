  - p1 '{del_下次校准日期=Y,del_结论=N}' → ''
  expect: []
  allow: []
_pairs:
  示例历史对比:
    files:
    - base_2025.pdf
    - base_2026.pdf
    only_rules:
    - R6
    desc: 2025→2026 示例报告历史对比：校准点 10→15、制造商 空→示例制造厂、标准器 DP-A01→DP-B01
    expect:
    - rule_id: R6
      severity: 提示
      hint: '15'
    - rule_id: R6
      severity: 提示
      hint: 示例制造厂
    - rule_id: R6
      severity: 提示
      hint: DP-B01
    allow: []
